[package]
name = "dust_denoiser"
version = "0.1.0"
edition = "2024"

# Pluggable denoiser/upscaler backends. Each backend lives in its own module
# (currently only `dlss`). The DLSS module is the only place inside dust that
# calls into nvsdk_ngx_*.

[dependencies]
bevy.workspace = true
pumicite.workspace = true
bevy_pumicite.workspace = true
dust_app.workspace = true
runfiles = "0.2"
tracing = "0.1"
