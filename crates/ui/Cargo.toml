[package]
name = "dust_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
pumicite.workspace = true
dust_input.workspace = true
gpui.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
raw-window-handle = "0.6"
tracing = "0.1"

# Apple platforms and Windows have swapchains of their own. The `apple` module
# makes one from a display link's drawables, and the `win32` module presents
# with the composition swapchain API. Other platforms use the swapchain from
# `bevy_pumicite`.
[target.'cfg(not(any(target_vendor = "apple", windows)))'.dependencies]
bevy_pumicite = { workspace = true, features = ["swapchain"] }

[target.'cfg(windows)'.dependencies]
bevy_pumicite.workspace = true
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_CompositionSwapchain",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
bevy_pumicite.workspace = true
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-metal = "0.3.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-quartz-core", "NSCursor", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "CALayer", "CAMetalDisplayLink", "CAMetalLayer"] }
