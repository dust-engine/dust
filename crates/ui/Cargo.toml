[package]
name = "dust_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
pumicite.workspace = true
dust_input.workspace = true
gpui.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
raw-window-handle = "0.6"

# Apple platforms use the `apple` module's swapchain, made from a display link's
# drawables; the others use `bevy_pumicite`'s.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
bevy_pumicite = { workspace = true, features = ["swapchain"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
bevy_pumicite.workspace = true
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-metal = "0.3.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-quartz-core", "NSCursor", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "CALayer", "CAMetalDisplayLink", "CAMetalLayer"] }
