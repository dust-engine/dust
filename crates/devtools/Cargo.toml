[package]
name = "dust_devtools"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
bevy_pumicite.workspace = true
gpui.workspace = true
gpui-component.workspace = true
dust_ui.workspace = true
dust_pbr.workspace = true
dust_profiler.workspace = true
dust_character.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
shlex = "2"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# For the sets of systems in the build pass of a test.
indexmap = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
