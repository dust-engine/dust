[package]
name = "dust_devtools"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
bevy_pumicite.workspace = true
gpui.workspace = true
gpui-component.workspace = true
dust_ui.workspace = true
dust_pbr.workspace = true
dust_profiler.workspace = true
dust_character.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Completes the prompt's commands on Tab, with the shell-agnostic engine that
# `unstable-dynamic` adds.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
shlex = "2"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
async-io = "2"
async-broadcast = "0.7"
futures-lite = "2"
# Only reads, but has the KTX2 container's pieces as bytes.
ktx2 = "0.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[dev-dependencies]
# For the sets of systems in the build pass of a test.
indexmap = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
