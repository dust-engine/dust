[package]
name = "dust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = [
  "crates/*",
]

[workspace.dependencies]
dust_vdb = { path = "crates/vdb" }
dust_vox = { path = "crates/vox" }
dust_pbr = { path = "crates/pbr" }
dust_app = { path = "crates/app" }
dust_gfxdebug = { path = "crates/gfxdebug" }
dust_physics = { path = "crates/physics" }
# The local avian branch: adds the pluggable `QueryDispatcher` resource that routes
# `VdbShape` pairs to `dust_physics::VdbDispatcher`.
avian3d = { path = "../avian/crates/avian3d", default-features = false, features = ["3d", "parry-f32"] }
pumicite = { git = "https://github.com/dust-engine/pumicite.git", rev = "1ebb1d8aa8a889e96095f42efd589d7a4bb0c8d3" }
bevy_pumicite = { git = "https://github.com/dust-engine/pumicite.git", rev = "1ebb1d8aa8a889e96095f42efd589d7a4bb0c8d3" }
pumicite_egui = { git = "https://github.com/dust-engine/pumicite.git", rev = "1ebb1d8aa8a889e96095f42efd589d7a4bb0c8d3" }
pumicite_super_resolution = { git = "https://github.com/dust-engine/pumicite_super_resolution.git", rev = "81985bf31b949dfd36fa73b4d73bedd12ca694ba" }

[dependencies]
dust_vox.workspace = true
dust_pbr.workspace = true
dust_app.workspace = true
dust_gfxdebug.workspace = true
dust_physics.workspace = true
avian3d.workspace = true
bevy.workspace = true
pumicite.workspace = true
bevy_pumicite.workspace = true

[workspace.dependencies.bevy]
version = "0.19.0"
default-features = false
features = [
    "std",
    "async_executor",
    "bevy_winit",
    "bevy_log",
    "bevy_window",
    "bevy_asset",
    "bevy_scene",
    "debug",
    "reflect_auto_register",
    "multi_threaded",
]

[patch.crates-io]
ash = { git = "https://github.com/0xbeefd1ed/ash.git", branch = "meta" }
# The local parry fork `dust_physics` is written against; avian must see the same
# `Shape` trait, so its crates.io `parry3d` resolves to the same package.
parry3d = { path = "../parry/crates/parry3d" }
# glamx 0.3 re-pointed at glam 0.32, the version bevy_math uses, so avian can pass
# bevy vectors to parry unchanged.
glamx = { path = "../glamx" }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" }
bevy_app = { path = "../bevy/crates/bevy_app" }
bevy_window = { path = "../bevy/crates/bevy_window" }
bevy_platform = { path = "../bevy/crates/bevy_platform" }
bevy_utils = { path = "../bevy/crates/bevy_utils" }
bevy_transform = { path = "../bevy/crates/bevy_transform" }
bevy_time = { path = "../bevy/crates/bevy_time" }
bevy_tasks = { path = "../bevy/crates/bevy_tasks" }
bevy_reflect = { path = "../bevy/crates/bevy_reflect" }
bevy_ptr = { path = "../bevy/crates/bevy_ptr" }
bevy_math = { path = "../bevy/crates/bevy_math" }
bevy_log = { path = "../bevy/crates/bevy_log" }
bevy_input = { path = "../bevy/crates/bevy_input" }
bevy_diagnostic = { path = "../bevy/crates/bevy_diagnostic" }
bevy_derive = { path = "../bevy/crates/bevy_derive" }
bevy_winit = { path = "../bevy/crates/bevy_winit" }
bevy_internal = { path = "../bevy/crates/bevy_internal" }
bevy_asset = { path = "../bevy/crates/bevy_asset" }
bevy_camera = { path = "../bevy/crates/bevy_camera" }
bevy_scene = { path = "../bevy/crates/bevy_scene" }
bevy = { path = "../bevy" }

[patch."https://github.com/ash-rs/ash.git"]
ash = { git = "https://github.com/0xbeefd1ed/ash", branch = "meta" }

# If overriding pumicite, use cargo to build the project. Bazel wouldn't support this.
[patch."https://github.com/dust-engine/pumicite.git"]
pumicite = { path = "../pumicite" }
bevy_pumicite = { path = "../pumicite/crates/bevy" }
pumicite_egui = { path = "../pumicite/crates/egui" }

[profile.release]
debug = true

[profile.dev.package.dust_vdb]
opt-level = 3

[profile.dev]
panic = "abort"
