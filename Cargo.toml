[package]
name = "dust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = [
  "crates/*",
]

[workspace.dependencies]
dust_vdb = { path = "crates/vdb" }
dust_vox = { path = "crates/vox" }
dust_pbr = { path = "crates/pbr" }
dust_app = { path = "crates/app" }
dust_devtools = { path = "crates/devtools" }
dust_profiler = { path = "crates/profiler" }
dust_physics = { path = "crates/physics" }
dust_character = { path = "crates/character" }
# The local avian branch: adds the pluggable `QueryDispatcher` resource that routes
# `VdbShape` pairs to `dust_physics::VdbDispatcher`.
avian3d = { git = "https://github.com/0xbeefd1ed/avian.git", branch = "main", default-features = false, features = ["3d", "parry-f32"] }
pumicite = { git = "https://github.com/dust-engine/pumicite.git", rev = "084ec0fa2718484f446adf359182c1dc2889ba61" }
bevy_pumicite = { git = "https://github.com/dust-engine/pumicite.git", rev = "084ec0fa2718484f446adf359182c1dc2889ba61" }
pumicite_egui = { git = "https://github.com/dust-engine/pumicite.git", rev = "084ec0fa2718484f446adf359182c1dc2889ba61" }

[dependencies]
dust_vox.workspace = true
dust_pbr.workspace = true
dust_app.workspace = true
dust_devtools.workspace = true
dust_physics.workspace = true
dust_character.workspace = true
avian3d.workspace = true
bevy.workspace = true
pumicite.workspace = true
bevy_pumicite.workspace = true

[workspace.dependencies.bevy]
version = "0.20.0"
default-features = false
features = [
    "std",
    "async_executor",
    "bevy_winit",
    "bevy_log",
    "bevy_window",
    "bevy_asset",
    "bevy_scene",
    "debug",
    "reflect_auto_register",
    "multi_threaded",
]

[patch.crates-io]
ash = { git = "https://github.com/0xbeefd1ed/ash.git", branch = "meta" }
# The local parry fork `dust_physics` is written against; avian must see the same
# `Shape` trait, so its crates.io `parry3d` resolves to the same package.
parry3d = { git = "https://github.com/0xbeefd1ed/parry.git", branch = "generic-voxels" }
bevy_ecs = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_app = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_window = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_platform = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_utils = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_transform = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_time = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_tasks = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_reflect = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_ptr = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_math = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_log = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_input = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_diagnostic = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_derive = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_winit = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_internal = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_asset = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_camera = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy_scene = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }
bevy = { git = "https://github.com/dust-engine/bevy.git", branch = "release-0.20.0" }

[patch."https://github.com/ash-rs/ash.git"]
ash = { git = "https://github.com/0xbeefd1ed/ash", branch = "meta" }

[profile.release]
debug = true

[profile.dev.package.dust_vdb]
opt-level = 3

[profile.dev]
panic = "abort"
